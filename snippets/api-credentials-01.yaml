components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: sessionlab_sid }
    apiKey:        { type: apiKey, in: header, name: X-API-Key }
    bearerAuth:    { type: http, scheme: bearer, bearerFormat: JWT }
    signedRequest: { type: apiKey, in: header, name: X-Signature }
paths:
  /api/me:
    get:
      security:                 # either credential is enough (OR)
        - bearerAuth: []
        - apiKey: []
