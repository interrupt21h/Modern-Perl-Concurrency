name: Format Perl and rebuild handbook
on:
  push:
    branches: [main]
    paths:
      - 'modern-perl-concurrency-v1.3-tidy-workflow.zip'
      - 'guide.tex'
      - '**.tex'
      - 'examples/**'
      - 'snippets/**'
      - 'scripts/**'
      - 'styles/**'
      - 'figures/**'
      - 'Makefile'
      - 'run-tests.sh'
      - 'requirements-docs.txt'
      - '.perltidyrc'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: handbook-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tidy:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Import exact Edition 1.3 source archive if present
        id: source
        shell: bash
        run: |
          set -euo pipefail
          archive=modern-perl-concurrency-v1.3-tidy-workflow.zip
          if [[ -f "$archive" ]]; then
            echo 'dc72ba53d059b00b29f51347f1553e3d2b3d16735a47994c66a9352897eeb217  modern-perl-concurrency-v1.3-tidy-workflow.zip' | sha256sum --check
            test ! -e guide.tex
            temp=$(mktemp -d)
            unzip -q "$archive" -d "$temp"
            test -f "$temp/perl-concurrency/guide.tex"
            # Keep the installed import-capable workflow instead of the archived workflow.
            rsync -a --exclude=.github/ "$temp/perl-concurrency/" ./
            rm -rf "$temp"
            git rm -- "$archive"
            git add --all
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Import Edition 1.3 handbook source and laboratory'
            git push origin HEAD:main
            echo 'imported=true' >> "$GITHUB_OUTPUT"
          else
            echo 'imported=false' >> "$GITHUB_OUTPUT"
          fi
          test -f guide.tex || { echo '::error::Upload modern-perl-concurrency-v1.3-tidy-workflow.zip to the repository root first.'; exit 1; }
      - name: Install build tools and disposable Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y cpanminus make gcc latexmk texlive-latex-extra texlive-pictures texlive-fonts-recommended lmodern python3-venv redis-server libredis-perl
          sudo cpanm SHANCOCK/Perl-Tidy-20260826.tar.gz
          perltidy --version
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-docs.txt
          sudo systemctl start redis-server
          redis-cli ping
      - name: Format, check, test and rebuild
        shell: bash
        env:
          REDIS_SERVER: 127.0.0.1:6379
        run: |
          set -euo pipefail
          export PATH="$PWD/.venv/bin:$PATH"
          make tidy-rebuild 2>&1 | tee tidy-build.txt
          git diff -- examples snippets > tidy-source.diff
      - name: Package formatted source and PDF
        run: |
          mkdir -p dist
          tar --exclude=.git --exclude=.venv --exclude=dist --exclude='guide.pdf' --exclude='guide.aux' --exclude='guide.log' --exclude='guide.fls' --exclude='guide.fdb_latexmk' --exclude='guide.out' --exclude='guide.toc' -czf dist/formatted-source.tar.gz .
          cp guide.pdf tidy-build.txt tidy-source.diff dist/
      - uses: actions/upload-artifact@v4
        with:
          name: tidied-perl-handbook
          path: dist/
          if-no-files-found: error
      - name: Persist validated formatting on initial import
        if: steps.source.outputs.imported == 'true'
        run: |
          git add examples snippets generated
          if ! git diff --cached --quiet; then
            git commit -m 'Apply verified Perl::Tidy formatting and regenerate listings'
            git push origin HEAD:main
          fi
